# render.yaml - Configuración simplificada y corregida para Render
services:
  - type: web
    name: botiqoption-4
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT main:application"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        value: "7787754995:AAEvM36bO9B4SvGA1cr1VP1j-Rx6on5LrjM"
      - key: TELEGRAM_CHAT_ID
        value: "7009100334"
      - key: RENDER
        value: "true"
    autoDeploy: true
