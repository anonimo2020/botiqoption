version: 1
services:
  - type: web
    name: iq-option-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_CHAT_ID
      - key: FLASK_SECRET_KEY
