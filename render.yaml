# render.yaml - Configuración para Render
services:
  - type: web
    name: trading-bot-opciones-binarias-pro
    env: python
    region: oregon
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "python main.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PORT
        value: 10000
    disk:
      name: trading-bot-storage
      mountPath: /tmp
      sizeGB: 1
    autoDeploy: true
    branch: main
    repo: https://github.com/tu-usuario/trading-bot-opciones-binarias-pro
    
  # Opcional: Worker para tareas en background
  - type: worker
    name: trading-bot-worker
    env: python
    region: oregon
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "python worker.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: FLASK_SECRET_KEY
        fromService:
          type: web
          name: trading-bot-opciones-binarias-pro
          envVarKey: FLASK_SECRET_KEY
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    repo: https://github.com/tu-usuario/trading-bot-opciones-binarias-pro
    branch: main
    autoDeploy: true

# Configuración de base de datos (opcional para métricas persistentes)
databases:
  - name: trading-bot-redis
    plan: starter
    type: redis
    region: oregon
    
# Variables de entorno globales
envVarGroups:
  - name: trading-bot-config
    envVars:
      - key: MAX_WORKERS
        value: 4
      - key: TIMEOUT
        value: 120
      - key: LOG_LEVEL
        value: INFO
      - key: SESSION_TIMEOUT
        value: 86400
      - key: MAX_CONCURRENT_BOTS
        value: 10
