services:
  - type: web
    name: trading-bot-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT backend:app"
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FLASK_ENV
        value: production
    healthCheckPath: /health
    domains:
      - botiqoption-4.onrender.com
