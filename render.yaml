services:
  # Web service
  - type: web
    name: iqoption-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 4 --threads 2 --worker-class gthread
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: REDIS_URL
        fromService:
          name: iqoption-redis
          type: redis
          property: connectionString
    healthCheckPath: /health
    
  # Redis service for sessions
  - type: redis
    name: iqoption-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
